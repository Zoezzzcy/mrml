<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#126724">
<title>MRML 录分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #F3F5F3; --card: #FFFFFF; --fg: #1A211C; --muted: #5C665F; --line: #DCE2DD; --field: #FFFFFF;
    --green: #126724; --green-soft: #E5F0E7; --red: #CD0000; --red-soft: #FBE7E7; --grey: #8F9691;
    --r1: #28A745; --r2: #17A2B8; --r3: #6C757D; --r4: #DC3545;
    --font: 'Noto Sans', 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101511; --card: #1A211C; --fg: #EEF2EF; --muted: #A3ADA6; --line: #2E3831; --field: #121813;
      --green: #3FA157; --green-soft: #183622; --red: #FF5A5A; --red-soft: #3A1717; --grey: #8F9691; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101511; --card: #1A211C; --fg: #EEF2EF; --muted: #A3ADA6; --line: #2E3831; --field: #121813;
    --green: #3FA157; --green-soft: #183622; --red: #FF5A5A; --red-soft: #3A1717; --grey: #8F9691; color-scheme: dark;
  }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 34px; height: auto; border-radius: 6px; }
  header .word { font-weight: 800; font-size: 20px; letter-spacing: .02em; }
  header .back { margin-left: auto; color: var(--green); font-weight: 700; text-decoration: none; font-size: 14px; }
  .langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--card); }
  .langs button { border: 0; background: none; color: var(--muted); font: 600 12px var(--font); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--green); color: #fff; }

  h1 { margin: 0; font-size: 24px; font-weight: 800; text-wrap: balance; }
  h1::after { content: ''; display: block; width: 56px; height: 3px; margin-top: 6px; border-radius: 2px;
    background: linear-gradient(90deg, var(--red) 0 50%, var(--green) 50% 100%); }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
  input, select { font: 600 16px var(--font); color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--green); outline-offset: 0; border-color: transparent; }
  .rule { font-size: 12px; color: var(--muted); }
  .rule b { color: var(--fg); }

  .players { display: flex; flex-direction: column; gap: 10px; }
  .p { display: grid; grid-template-columns: 26px minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; align-items: center; }
  .p .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--green-soft); color: var(--green); }
  .p .new { grid-column: 2 / 4; }
  .p .new.clash { border-color: var(--red); background: var(--red-soft); }
  .p .taken { grid-column: 2 / 4; font-size: 13px; font-weight: 700; color: var(--red); line-height: 1.4; }
  .p input.score { text-align: right; font-variant-numeric: tabular-nums; }
  .p .pen { grid-column: 2 / 4; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-weight: 700; }
  .p .pen input { padding: 6px 9px; font-size: 14px; }
  .toggle { align-self: flex-start; border: 0; background: none; color: var(--green); font: 700 13px var(--font); padding: 0; cursor: pointer; }

  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-variant-numeric: tabular-nums; }
  .total .v { font-weight: 800; font-size: 18px; }
  .total.ok { background: var(--green-soft); } .total.ok .v { color: var(--green); }
  .total.bad { background: var(--red-soft); } .total.bad .v { color: var(--red); }

  .preview { display: flex; flex-direction: column; gap: 6px; }
  .pr { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
  .badge { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--card); font-weight: 800; font-size: 12px; border: 2.5px solid; }
  .pts { font-weight: 800; }
  .pts.pos { color: var(--green); } .pts.neg { color: var(--red); }
  .pts.neg::before { content: '▼'; font-size: .8em; margin-right: 1px; }

  textarea { font: 500 15px var(--font); color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; width: 100%; min-height: 64px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  .need textarea { border-color: var(--red); background: var(--red-soft); }
  .hint { font-size: 12px; font-weight: 600; color: var(--muted); }
  .go { font: 800 17px var(--font); color: #fff; background: var(--red); border: 0; border-radius: 12px; padding: 14px; cursor: pointer; }
  .go:disabled { background: var(--grey); cursor: not-allowed; opacity: .7; }
  .msg { font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 10px; }
  .msg.err { background: var(--red-soft); color: var(--red); }
  .msg.info { background: var(--bg); color: var(--muted); }
  .done { text-align: center; align-items: center; }
  .done .big { font-size: 40px; line-height: 1; color: var(--green); }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn2 { font: 700 15px var(--font); border-radius: 10px; padding: 10px 16px; border: 1px solid var(--green); color: var(--green); background: var(--card); text-decoration: none; cursor: pointer; }
  .btn2.fill { background: var(--green); color: #fff; }
  .foot { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="__LOGO__" alt="MRML">
    <span class="word">MRML</span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button>
    </div>
    <a class="back" href="index.html" data-i="back"></a>
  </header>

  <div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="intro"></p>
  </div>

  <p class="msg err" id="notready" hidden data-i="notready"></p>

  <form id="form" class="card" novalidate>
    <label class="f"><span data-i="date"></span><input type="date" id="date" required></label>
    <div class="rule" id="rule"></div>

    <div class="players" id="players"></div>
    <button type="button" class="toggle" id="pentoggle" data-i="addpen"></button>

    <div class="total" id="total"><span data-i="total"></span><span class="v" id="totalv">0</span></div>

    <div class="preview" id="preview" hidden></div>

    <label class="f" id="notebox"><span data-i="note"></span><textarea id="note" maxlength="300"></textarea><span class="hint" id="notehint" data-i="notehint" hidden></span></label>

    <label class="f"><span data-i="by"></span><select id="by"></select></label>

    <p class="msg err" id="err" hidden></p>
    <button type="submit" class="go" id="go" data-i="submit"></button>
  </form>

  <div class="card done" id="done" hidden>
    <div class="big">✓</div>
    <strong data-i="saved"></strong>
    <p class="sub" data-i="savednote"></p>
    <div class="preview" id="donepreview" style="align-self: stretch"></div>
    <div class="btns">
      <button type="button" class="btn2 fill" id="again" data-i="again"></button>
      <a class="btn2" href="index.html" data-i="see"></a>
    </div>
  </div>

  <p class="foot" data-i="foot"></p>
</div>

<script>
(function () {
  const ENDPOINT = '__ENDPOINT__';
  const SEASONS = __SEASONS__;
  const NAMES = __NAMES__;
  const SHEET = '1vcRSRL1m5N8vQ11yca-mJo3MCVBbzCCBS4IUNi5240E';

  const T = {
    back: ['← 排名', '← 順位表', '← Standings'],
    title: ['录入成绩', '成績入力', 'Enter a game'],
    intro: ['每桌打完一局，由一个人录入四人的最终得点。', '1半荘終了後、卓の誰か1人が4人の最終持ち点を入力してください。', 'After each game, one player per table enters all four final scores.'],
    notready: ['录分还没开通：管理员还没完成表格连接。', '入力はまだ準備中です（管理者の設定待ち）。', 'Score entry isn’t switched on yet — the organiser still needs to connect the sheet.'],
    date: ['日期', '日付', 'Date'],
    pin: ['联赛口令', 'リーグ合言葉', 'League code'],
    player: ['选手', '選手', 'Player'],
    score: ['最终得点', '最終持ち点', 'Final score'],
    choose: ['选择选手', '選手を選択', 'Choose player'],
    newp: ['＋ 新选手…', '＋ 新しい選手…', '+ New player…'],
    newname: ['新选手名字', '新しい選手名', 'New player name'],
    addpen: ['＋ 有罚分', '＋ ペナルティあり', '+ Add penalties'],
    hidepen: ['− 收起罚分', '− ペナルティを閉じる', '− Hide penalties'],
    pen: ['罚分（自动扣除）pt', 'ペナルティ（自動で減点）pt', 'Penalty (deducted) pt'],
    total: ['四人合计', '4人合計', 'Total of four'],
    by: ['谁在录入', '入力者', 'Entered by'],
    note: ['备注（可选：犯规、错和、供托等）', '備考（任意：チョンボ・供託など）', 'Note (optional: foul, chombo, sticks left…)'],
    notehint: ['合计不平也可以提交；方便的话在备注写一下原因（例如：犯规、供托立直棒）。', '合計が合わなくても送信できます。可能なら備考に理由を。', 'You can still submit — if you can, add the reason in the note.'],
    unbal: ['合计不平，已附备注', '合計不一致（備考あり）', 'Unbalanced, note added'],
    submit: ['提交这一局', 'この対局を送信', 'Submit this game'],
    sending: ['提交中…', '送信中…', 'Sending…'],
    saved: ['已记录！', '記録しました！', 'Saved!'],
    savednote: ['刷新排名页就能看到。', '順位表を再読み込みすると反映されます。', 'Reload the standings to see it.'],
    again: ['再录一局', 'もう1局入力', 'Enter another'],
    see: ['看排名', '順位表へ', 'See standings'],
    foot: ['录错了？告诉联赛管理员在表格里修改。', '間違えた場合は管理者に修正を依頼してください。', 'Made a mistake? Ask the organiser to fix it in the sheet.'],
    rule: ['{s}：起始 {sp} 点，四人合计应为 {tot}。', '{s}：配給 {sp} 点、4人合計は {tot}。', '{s}: start {sp}, the four scores must add up to {tot}.'],
    noseason: ['这个日期不在任何赛季内。', 'この日付はどのシーズンにも含まれません。', 'That date isn’t in any season.'],
    diffover: ['多了 {d}', '{d} 多い', '{d} too many'],
    diffunder: ['少了 {d}', '{d} 足りない', '{d} short'],
    e_missing: ['请为四个位置都选好选手。', '4人全員の選手を選んでください。', 'Choose a player for all four seats.'],
    e_dup: ['同一个选手出现了两次。', '同じ選手が2回選ばれています。', 'The same player is chosen twice.'],
    e_taken: ['已经有选手叫「{n}」。是同一个人就直接从列表里选；不是的话请加个区分，比如「{n} L」或昵称。', '「{n}」という選手は既にいます。同じ人ならリストから選び、別の人なら「{n} L」のように区別してください。', 'There is already a player called “{n}”. If it’s the same person, pick them from the list; if not, add something to tell them apart, e.g. “{n} L”.'],
    e_score: ['得点要填整百的数字，例如 32,400。', '持ち点は100点単位で入力してください（例：32400）。', 'Scores must be in hundreds, e.g. 32400.'],
    e_total: ['四人合计不对：请检查分数，或在备注里写明原因。', '4人合計が合いません。スコアを確認するか、備考に理由を書いてください。', 'The four scores don’t add up — check them, or explain why in the note.'],
    e_pin: ['联赛口令不对。', '合言葉が違います。', 'Wrong league code.'],
    e_net: ['没连上，请检查网络后再试。', '接続できませんでした。もう一度お試しください。', 'Couldn’t reach the sheet. Check your connection and try again.'],
    e_other: ['提交失败：{c}', '送信に失敗しました：{c}', 'Couldn’t save: {c}'],
    place: ['位', '位', ''],
  };
  let lang = 'zh';
  try { const saved = localStorage.getItem('mrml-lang'); if (saved) lang = saved; else if ((navigator.language || '').startsWith('ja')) lang = 'ja'; } catch (e) {}
  if (!['zh', 'ja', 'en'].includes(lang)) lang = 'zh';
  const li = () => ({ zh: 0, ja: 1, en: 2 })[lang];
  const tr = (k, vars) => { let s = (T[k] || [k, k, k])[li()]; if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b); return s; };
  const fmt = (n) => Number(n).toLocaleString('en-US');

  const $ = (id) => document.getElementById(id);
  const form = $('form'), playersEl = $('players');
  let showPen = false;
  let names = NAMES.slice();

  // ---- build the four seats ----
  const seats = [];
  for (let k = 0; k < 4; k++) {
    const wrap = document.createElement('div'); wrap.className = 'p';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(k + 1);
    const sel = document.createElement('select'); sel.className = 'name';
    const score = document.createElement('input'); score.className = 'score'; score.type = 'text'; score.inputMode = 'numeric'; score.autocomplete = 'off';
    const nw = document.createElement('input'); nw.className = 'new'; nw.type = 'text'; nw.hidden = true; nw.maxLength = 40;
    const pen = document.createElement('label'); pen.className = 'pen'; pen.hidden = true;
    const penLab = document.createElement('span');
    const penIn = document.createElement('input'); penIn.type = 'text'; penIn.inputMode = 'decimal'; penIn.placeholder = '';
    pen.append(penLab, penIn);
    const taken = document.createElement('div'); taken.className = 'taken'; taken.hidden = true; taken.setAttribute('role', 'alert');
    wrap.append(n, sel, score, nw, taken, pen);
    playersEl.appendChild(wrap);
    seats.push({ sel, score, nw, taken, pen, penLab, penIn });
    sel.addEventListener('change', () => { nw.hidden = sel.value !== '__new'; if (!nw.hidden) nw.focus(); update(); });
    [score, nw, penIn].forEach((el) => { el.addEventListener('input', update); el.addEventListener('change', update); el.addEventListener('compositionend', update); el.addEventListener('blur', update); });
  }

  const fillNames = () => {
    for (const s of seats) {
      const cur = s.sel.value;
      s.sel.replaceChildren();
      const o0 = new Option(tr('choose'), ''); o0.disabled = true; s.sel.add(o0);
      names.forEach((nm) => s.sel.add(new Option(nm, nm)));
      s.sel.add(new Option(tr('newp'), '__new'));
      s.sel.value = cur && [...s.sel.options].some((o) => o.value === cur) ? cur : '';
    }
  };

  const seasonFor = (iso) => SEASONS.find((s) => s.start <= iso && iso <= s.end) || null;
  const parseScore = (v) => { const s = String(v || '').replace(/[,\s，]/g, ''); if (s === '') return null; return /^-?\d+$/.test(s) ? Number(s) : NaN; };
  // Phone number pads have no minus key, so a penalty is typed as a plain number and always deducted (20 → −20).
  const parsePen = (v) => { const s = String(v || '').replace(/[\s，]/g, '').replace('−', '-').replace('－', '-'); if (s === '') return 0; return /^-?\d+(\.\d+)?$/.test(s) ? -Math.abs(Number(s)) : NaN; };

  // A "new player" name that matches someone already in the league (ignoring case and spaces).
  const norm = (n) => String(n || '').toLowerCase().replace(/\s+/g, '');
  const takenNew = () => { for (const s of seats) { if (s.sel.value !== '__new') continue; const v = s.nw.value.trim(); const hit = names.find((n) => norm(n) === norm(v)); if (v && hit) return hit; } return null; };
  const read = () => seats.map((s) => ({
    name: s.sel.value === '__new' ? s.nw.value.trim() : s.sel.value,
    score: parseScore(s.score.value),
    penalty: parsePen(s.penIn.value)
  }));

  // Places with ties sharing the bonus, as the dashboard does.
  const pointsFor = (ps, season) => {
    const uma = [season.uma_1, season.uma_2, season.uma_3, season.uma_4].map(Number);
    const order = ps.map((p, i) => ({ ...p, i })).sort((a, b) => b.score - a.score);
    let pos = 0;
    while (pos < 4) {
      let j = pos; while (j + 1 < 4 && order[j + 1].score === order[pos].score) j++;
      const share = uma.slice(pos, j + 1).reduce((a, b) => a + b, 0) / (j - pos + 1);
      for (let q = pos; q <= j; q++) { order[q].place = pos + 1; order[q].pts = Math.round(((order[q].score - season.start_points) / 1000 + share + order[q].penalty) * 10) / 10; }
      pos = j + 1;
    }
    return order;
  };

  const drawPreview = (el, rows) => {
    el.replaceChildren();
    rows.forEach((r) => {
      const d = document.createElement('div'); d.className = 'pr';
      const b = document.createElement('span'); b.className = 'badge';
      const c = ['--r1', '--r2', '--r3', '--r4'][Math.min(3, Math.round(r.place) - 1)];
      b.style.borderColor = `var(${c})`; b.style.color = `var(${c})`;
      b.textContent = Number.isInteger(r.place) ? String(r.place) : r.place.toFixed(1);
      const nm = document.createElement('span'); nm.textContent = `${r.name}  ·  ${fmt(r.score)}`;
      const p = document.createElement('span'); p.className = 'pts ' + (r.pts < 0 ? 'neg' : 'pos');
      p.textContent = (r.pts < 0 ? '' : '+') + Math.abs(r.pts).toFixed(1) + 'pt';
      d.append(b, nm, p); el.appendChild(d);
    });
  };

  let lastProblem = null;
  let sending = false;
  function update() {
    const iso = $('date').value;
    const season = seasonFor(iso);
    $('rule').textContent = season ? tr('rule', { s: season.season_name.replace(/\s*-.*/, ''), sp: fmt(season.start_points), tot: fmt(season.start_points * 4) }) : tr('noseason');
    const ps = read();
    const total = ps.reduce((t, p) => t + (Number.isFinite(p.score) ? p.score : 0), 0);
    const tv = $('totalv'), tb = $('total');
    tb.classList.remove('ok', 'bad');
    let problem = null;
    if (!season) problem = 'noseason';
    else if (ps.some((p) => !p.name)) problem = 'e_missing';
    else if (new Set(ps.map((p) => p.name.toLowerCase())).size < 4) problem = 'e_dup';
    else if (takenNew()) problem = 'e_taken';
    else if (ps.some((p) => p.score === null || !Number.isFinite(p.score) || p.score % 100 !== 0 || !Number.isFinite(p.penalty))) problem = 'e_score';
    const note = $('note').value.trim();
    const unbalanced = !!season && total !== season.start_points * 4;
    $('notehint').hidden = !(unbalanced && !note && ps.every((p) => p.name && Number.isFinite(p.score)));
    const anyScore = ps.some((p) => p.score !== null);
    if (season && anyScore) {
      const diff = total - season.start_points * 4;
      tv.textContent = fmt(total) + (diff === 0 ? ' ✓' : '  (' + tr(diff > 0 ? 'diffover' : 'diffunder', { d: fmt(Math.abs(diff)) }) + ')');
      tb.classList.add(diff === 0 ? 'ok' : 'bad');
    } else tv.textContent = season ? '0 / ' + fmt(season.start_points * 4) : '—';
    const pv = $('preview');
    if (!problem) { pv.hidden = false; drawPreview(pv, pointsFor(ps, season)); } else pv.hidden = true;
    // "Entered by" lists the chosen players.
    const by = $('by'), cur = by.value;
    const chosen = ps.map((p) => p.name).filter(Boolean);
    by.replaceChildren(...chosen.map((n) => new Option(n, n)));
    let remembered = ''; try { remembered = localStorage.getItem('mrml-me') || ''; } catch (e) {}
    by.value = chosen.includes(cur) ? cur : (chosen.includes(remembered) ? remembered : (chosen[0] || ''));
    $('go').disabled = !!problem || !ENDPOINT || sending;
    lastProblem = problem;
    // Say right away when a new name is already taken (the button is greyed out, so it can't wait for submit).
    // Warn right under the name box (on a phone the bottom of the form is off screen), and at the bottom too.
    seats.forEach((s) => {
      const v = s.sel.value === '__new' ? s.nw.value.trim() : '';
      const hit = v ? names.find((n) => norm(n) === norm(v)) : null;
      s.nw.classList.toggle('clash', !!hit);
      s.taken.hidden = !hit;
      if (hit) s.taken.textContent = tr('e_taken', { n: hit });
    });
    if (problem === 'e_taken') { $('err').textContent = tr('e_taken', { n: takenNew() }); $('err').hidden = false; }
    else $('err').hidden = true;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = tr(el.dataset.i); });
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('pentoggle').textContent = tr(showPen ? 'hidepen' : 'addpen');
    seats.forEach((s, k) => {
      s.score.placeholder = tr('score'); s.nw.placeholder = tr('newname'); s.penLab.textContent = tr('pen');
      s.sel.setAttribute('aria-label', tr('player') + ' ' + (k + 1)); s.score.setAttribute('aria-label', tr('score') + ' ' + (k + 1));
    });
    fillNames(); update();
  }
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('mrml-lang', lang); } catch (e) {} applyLang(); }));
  $('pentoggle').addEventListener('click', () => { showPen = !showPen; seats.forEach((s) => { s.pen.hidden = !showPen; if (!showPen) s.penIn.value = ''; }); applyLang(); });
  $('date').addEventListener('input', update);
  $('note').addEventListener('input', update);

  // Today in the viewer's time zone.
  const now = new Date();
  $('date').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  if (!ENDPOINT) $('notready').hidden = false;

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  let subId = newId();

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    update();
    const err = $('err');
    if (lastProblem) { err.textContent = tr(lastProblem, { n: takenNew() || '' }); err.hidden = false; return; }
    if (!ENDPOINT || sending) return;
    const ps = read();
    const season = seasonFor($('date').value);
    const payload = { id: subId, date: $('date').value, by: $('by').value, note: $('note').value.trim(), players: ps };
    sending = true; $('go').disabled = true; $('go').textContent = tr('sending');
    let failed = '';
    try {
      const r = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload) });
      const res = await r.json();
      if (res.ok) {
        try { if (payload.by) localStorage.setItem('mrml-me', payload.by); } catch (e) {}
        drawPreview($('donepreview'), pointsFor(ps, season));
        form.hidden = true; $('done').hidden = false; window.scrollTo(0, 0);
      } else {
        const map = { bad_pin: 'e_pin', bad_total: 'e_total', duplicate_name: 'e_dup', missing_name: 'e_missing', bad_score: 'e_score', no_season: 'noseason' };
        failed = map[res.code] ? tr(map[res.code]) : tr('e_other', { c: res.code || '?' });
      }
    } catch (e) {
      failed = tr('e_net');
    } finally {
      sending = false; $('go').textContent = tr('submit'); update();
      if (failed) { err.textContent = failed; err.hidden = false; }
    }
  });

  $('again').addEventListener('click', () => {
    seats.forEach((s) => { s.score.value = ''; s.penIn.value = ''; });
    $('note').value = '';
    subId = newId();
    $('done').hidden = true; form.hidden = false; update();
    seats[0].score.focus();
  });

  applyLang();

  // Pick up players added to the sheet since this page was built.
  fetch('https://docs.google.com/spreadsheets/d/' + SHEET + '/gviz/tq?tqx=out:csv&headers=1&sheet=All_Games', { cache: 'no-store' })
    .then((r) => (r.ok ? r.text() : ''))
    .then((text) => {
      if (!text) return;
      const seen = new Set(names);
      const extra = [];
      text.split(/\r?\n/).slice(1).forEach((line) => {
        const cells = line.match(/"([^"]*)"/g) || [];
        [1, 4, 7, 10].forEach((i) => { const v = (cells[i] || '').replace(/"/g, '').trim(); if (v && !/^[\d,.\-]+$/.test(v) && !seen.has(v)) { seen.add(v); extra.push(v); } });
      });
      if (extra.length) { names = names.concat(extra.sort()); fillNames(); update(); }
    })
    .catch(() => {});
})();
</script>
</body>
</html>
